services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Copia .env.example a .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Copia .env.example a .env}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://192.168.1.172:8081
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Falta OIDC_CLIENT_SECRET}
      DEMO_PASSWORD_ENGINEER: ${DEMO_PASSWORD_ENGINEER:?Falta DEMO_PASSWORD_ENGINEER}
      DEMO_PASSWORD_AUDITOR: ${DEMO_PASSWORD_AUDITOR:?Falta DEMO_PASSWORD_AUDITOR}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:?Falta DEMO_PASSWORD_ADMIN}
      DEMO_PASSWORD_RRHH: ${DEMO_PASSWORD_RRHH:?Falta DEMO_PASSWORD_RRHH}
      DEMO_PASSWORD_TI: ${DEMO_PASSWORD_TI:?Falta DEMO_PASSWORD_TI}
      DEMO_PASSWORD_IAM: ${DEMO_PASSWORD_IAM:?Falta DEMO_PASSWORD_IAM}
      DEMO_PASSWORD_SOC_AUDITORIA: ${DEMO_PASSWORD_SOC_AUDITORIA:?Falta DEMO_PASSWORD_SOC_AUDITORIA}
      DEMO_PASSWORD_SEGURIDAD_FISICA: ${DEMO_PASSWORD_SEGURIDAD_FISICA:?Falta DEMO_PASSWORD_SEGURIDAD_FISICA}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/identity-access-realm.json:/opt/keycloak/data/import/identity-access-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  app:
    build: .
    environment:
      APP_SECRET: ${APP_SECRET:?Falta APP_SECRET}
      APP_DB: /srv/data/lab.sqlite
      APP_BASE_URL: ${APP_BASE_URL:-http://192.168.1.172:8000}
      SCIM_TOKEN: ${SCIM_TOKEN:?Falta SCIM_TOKEN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-identity-access-app}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Falta OIDC_CLIENT_SECRET}
      OIDC_METADATA_URL: ${OIDC_METADATA_URL:-http://127.0.0.1:8000/oidc/metadata}
      OIDC_INTERNAL_METADATA_URL: ${OIDC_INTERNAL_METADATA_URL:-http://keycloak:8080/realms/identity-access/.well-known/openid-configuration}
      OIDC_INTERNAL_BASE_URL: ${OIDC_INTERNAL_BASE_URL:-http://keycloak:8080/realms/identity-access/protocol/openid-connect}
      AUTHLIB_INSECURE_TRANSPORT: "1"
      DEMO_PASSWORD_ENGINEER: ${DEMO_PASSWORD_ENGINEER:?Falta DEMO_PASSWORD_ENGINEER}
      DEMO_PASSWORD_AUDITOR: ${DEMO_PASSWORD_AUDITOR:?Falta DEMO_PASSWORD_AUDITOR}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:?Falta DEMO_PASSWORD_ADMIN}
      DEMO_PASSWORD_RRHH: ${DEMO_PASSWORD_RRHH:?Falta DEMO_PASSWORD_RRHH}
      DEMO_PASSWORD_TI: ${DEMO_PASSWORD_TI:?Falta DEMO_PASSWORD_TI}
      DEMO_PASSWORD_IAM: ${DEMO_PASSWORD_IAM:?Falta DEMO_PASSWORD_IAM}
      DEMO_PASSWORD_SOC_AUDITORIA: ${DEMO_PASSWORD_SOC_AUDITORIA:?Falta DEMO_PASSWORD_SOC_AUDITORIA}
      DEMO_PASSWORD_SEGURIDAD_FISICA: ${DEMO_PASSWORD_SEGURIDAD_FISICA:?Falta DEMO_PASSWORD_SEGURIDAD_FISICA}
      NFC_ENABLED: ${NFC_ENABLED:-false}
      NFC_BRIDGE_TOKEN: ${NFC_BRIDGE_TOKEN:?Falta NFC_BRIDGE_TOKEN}
      NFC_LOGIN_USERNAME: ${NFC_LOGIN_USERNAME:-admin@example.test}
      NFC_LOGIN_PASSWORD: ${NFC_LOGIN_PASSWORD:-}
      NFC_TAP_TTL_SECONDS: ${NFC_TAP_TTL_SECONDS:-15}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/srv/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frigate:
    container_name: identity-access-frigate
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-0.14.1}
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-America/Mexico_City}
      FRIGATE_CAM_USER: ${FRIGATE_CAM_USER:-admin}
      FRIGATE_CAM_PASS: ${FRIGATE_CAM_PASS:-admin}
      FRIGATE_CAM_ENTRADA_IP: ${FRIGATE_CAM_ENTRADA_IP:-192.168.1.101}
      FRIGATE_CAM_INTERIOR_IP: ${FRIGATE_CAM_INTERIOR_IP:-192.168.1.102}
      FRIGATE_CAM_PORT: ${FRIGATE_CAM_PORT:-8080}
    volumes:
      - ./frigate/config:/config
      - ./frigate/storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"       # Interfaz Web HTTPS & API autenticada
      - "5000:5000"       # Interfaz Web HTTP plano / API local (ideal para app Flutter)
      - "8554:8554"       # go2rtc RTSP Feed (Conexión para Flutter / VLC)
      - "8555:8555/tcp"   # go2rtc WebRTC
      - "8555:8555/udp"   # go2rtc WebRTC

volumes:
  app_data:
  keycloak_data:
